version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: product_analytics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: product_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: product_analytics_bi
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: product_analytics
      MB_DB_PORT: 5432
      MB_DB_USER: postgres
      MB_DB_PASS: your_password
      MB_DB_HOST: postgres
    depends_on:
      - postgres

volumes:
  postgres_data:
